<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Búsqueda por ID/Nombre (Axios)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Pokédex - Búsqueda Directa (Axios)</h1>

        <!-- Formulario de búsqueda -->
        <div class="search-box">
            <input
                type="text"
                id="pokemonInput"
                placeholder="Ingresa nombre o ID del Pokémon"
                autocomplete="off"
            >
            <button id="searchButton">Buscar</button>
        </div>

        <!-- Área de resultados -->
        <div id="resultContainer" class="result-container">
            <!-- Aquí se insertará dinámicamente la tarjeta del Pokémon -->
        </div>

        <!-- Área de mensajes de error -->
        <div id="errorMessage" class="error-message"></div>
    </div>

    <!-- Importar Axios desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- Script con la lógica usando Axios -->
    <script src="app-axios.js"></script>
</body>
</html>
