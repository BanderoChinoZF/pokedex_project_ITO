<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscador Pokémon</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #eef3f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }
    .buscador { display: flex; gap: 8px; }
    .buscador input { padding: 10px; font-size: 16px; border: 2px solid #3b4cca; border-radius: 6px; }
    .buscador button { padding: 10px 18px; font-size: 16px; background: #ee1515; color: white; border: none; border-radius: 6px; cursor: pointer; }
    .tarjeta {
      margin-top: 24px;
      background: white;
      border: 3px solid #ffcb05;
      border-radius: 12px;
      padding: 20px 32px;
      text-align: center;
      min-width: 220px;
    }
    .tarjeta img { width: 160px; image-rendering: pixelated; }
    .tarjeta h2 { text-transform: capitalize; margin: 8px 0; }
    .error { color: #c00; }
  </style>
</head>
<body>
  <h1>Pokedex</h1>

  <!-- 1. El recuadro y el botón -->
  <div class="buscador">
    <input type="text" id="entrada" placeholder="Nombre o número, ej. pikachu o 25">
    <button id="btnBuscar">Buscar</button>
  </div>

  <!-- 2. Aquí se insertará la tarjeta con JavaScript -->
  <div id="resultado"></div>

  <!-- 3. Conectamos el JavaScript al final del body -->
  <script src="app.js"></script>
</body>
</html>
