<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buscador Pokémon</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <h1>Buscador Pokémon</h1>

        <p>Ingresa el nombre o número de un Pokémon</p>

        <div class="buscador">
            <input
                type="text"
                id="pokemonInput"
                placeholder="Nombre o número del Pokémon"
            >

            <button id="buscarBtn">
                Buscar
            </button>
        </div>

        <div id="resultado"></div>

    </div>

    <script type="module" src="/src/main.js"></script>

</body>
</html>
