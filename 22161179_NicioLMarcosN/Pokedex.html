<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Web</title>
    <!-- Aquí enlazamos el archivo CSS separado -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="pokedex-container">
        <header>
            <h1>Pokédex</h1>
            <p>Búsqueda por Identificador</p>
        </header>

        <div class="search-section">
            <input type="text" id="pokeInput" placeholder="Ej. lucario o 448">
            <button id="searchBtn">Buscar</button>
        </div>

        <article class="pokemon-card" id="pokeCard">
            <div class="image-container">
                <img id="pokeImg" src="" alt="Imagen del Pokémon">
            </div>
            
            <div class="pokemon-info">
                <span class="poke-id" id="pokeId"></span>
                <h2 id="pokeName"></h2>
                
                <div class="stats">
                    <p><strong>Peso:</strong> <span id="pokeWeight"></span> kg</p>
                    <p><strong>Altura:</strong> <span id="pokeHeight"></span> m</p>
                </div>
                
                <div class="types" id="pokeTypes"></div>
            </div>
        </article>

        <p class="error-msg" id="errorMsg">Pokémon no encontrado. Revisa el nombre o ID.</p>
    </main>

    <script>
        const inputElement = document.getElementById('pokeInput');
        const searchBtn = document.getElementById('searchBtn');
        const cardElement = document.getElementById('pokeCard');
        const errorMsgElement = document.getElementById('errorMsg');

        const pokeImg = document.getElementById('pokeImg');
        const pokeName = document.getElementById('pokeName');
        const pokeId = document.getElementById('pokeId');
        const pokeWeight = document.getElementById('pokeWeight');
        const pokeHeight = document.getElementById('pokeHeight');
        const pokeTypes = document.getElementById('pokeTypes');

     async function searchPokemon() {
            const query = inputElement.value.trim().toLowerCase();
            if (!query) return;

            cardElement.style.display = 'none';
            errorMsgElement.style.display = 'none';

            try {
                const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${query}`);
                
                if (!response.ok) {
                    throw new Error('No encontrado');
                }

                const data = await response.json();

                pokeName.textContent = data.name;
                pokeId.textContent = `#${data.id.toString().padStart(3, '0')}`;
                pokeWeight.textContent = data.weight / 10;
                pokeHeight.textContent = data.height / 10;
                pokeImg.src = data.sprites.front_default;

                pokeTypes.innerHTML = ''; 
                data.types.forEach(tipo => {
                    const span = document.createElement('span');
                    span.textContent = tipo.type.name;
                    pokeTypes.appendChild(span);
                });

                cardElement.style.display = 'block';

            } catch (error) {
                errorMsgElement.style.display = 'block';
            }
        };

        searchBtn.addEventListener('click', searchPokemon);
        
        inputElement.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                searchPokemon();
            }
        });
    </script>
</body>
</html>
